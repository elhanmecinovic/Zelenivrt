<svg width="80" height="80" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zeleni Vrt">
  <defs>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9ccc65" />
      <stop offset="100%" stop-color="#4caf50" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#9ccc65" />
    </linearGradient>
  </defs>

  <!-- outer ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.85" />

  <!-- stem -->
  <path d="M50 78 C50 64 50 54 50 42" stroke="url(#leafGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- left leaf -->
  <path d="M50 58 C36 58 28 50 26 38 C40 38 48 46 50 58 Z" fill="url(#leafGrad)" />
  <!-- right leaf -->
  <path d="M50 50 C64 50 72 42 74 30 C60 30 52 38 50 50 Z" fill="url(#leafGrad)" />
  <!-- top sprout leaf -->
  <path d="M50 44 C44 32 47 20 56 14 C61 25 58 38 50 44 Z" fill="url(#ringGrad)" />
</svg>
