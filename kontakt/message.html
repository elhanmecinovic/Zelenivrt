<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poruka Poslata - Zeleni Vrt</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="container">
        <div class="header-content">
          <div class="logo-section">
            <div class="logo">
              <img src="../img_logo/logo.svg" alt="Zeleni Vrt logo" />
            </div>
            <div class="site-title">
              <h1 data-translate="siteTitle">Zeleni Vrt</h1>
            </div>
          </div>
          <nav>
            <ul>
              <li>
                <a href="../pocetna/index.html" data-translate="navHome"
                  >Početna</a
                >
              </li>
              <li>
                <a href="../o_zelenom_vrtu/index.html" data-translate="navAbout"
                  >O Horoskopu</a
                >
              </li>
              <li>
                <a href="../zeleni_vrt/index.html" data-translate="navHoroscope"
                  >Horoskop</a
                >
              </li>
              <li>
                <a
                  href="../kontakt/index.html"
                  class="active"
                  data-translate="navContact"
                  >Kontakt</a
                >
              </li>
              <li>
                <a href="../login/index.html" data-translate="navLogin"
                  >Login</a
                >
              </li>
            </ul>
          </nav>
          <div class="language-switcher">
            <button class="lang-btn active" data-lang="sr">SRP</button>
            <button class="lang-btn" data-lang="en">ENG</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="page-hero">
        <div class="container">
          <div
            style="
              font-size: 4rem;
              margin-bottom: 20px;
              animation: bounce 1s ease infinite;
              color: #51cf66;
            "
          >
            🌱
          </div>
          <h2 data-translate="messageTitle">Poruka Uspešno Poslata!</h2>
          <p data-translate="messageSubtitle">
            Hvala vam što ste nas kontaktirali. Javićemo vam se uskoro.
          </p>
          <button
            onclick="location.href = 'index.html'"
            class="success-back-btn"
            data-translate="backToContact"
            style="margin-top: 30px"
          >
            Nazad na Kontakt
          </button>
        </div>
      </section>
    </main>

    <footer>
      <div class="container">
        <p data-translate="footer">
          &copy; 2025 Zeleni Vrt — Elhan Mecinović. Sva prava zadržana.
        </p>
      </div>
    </footer>

    <script src="../shared/translations.js"></script>
    <script src="message.js"></script>
  </body>
</html>
